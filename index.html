<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박대원의 청첩장 모임</title>
<meta name="description" content="10월 16일 (금) 오후 7시, 공간나인 파티룸 왕십리점">
<meta property="og:title" content="박대원의 청첩장 모임">
<meta property="og:description" content="10월 16일 (금) 오후 7시, 공간나인 파티룸 왕십리점">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08130F; --panel:#0D1F19; --gold:#D4AF6A; --gold2:#F1DCA7; --cream:#EDE3CB; --mute:#A79D86;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--bg); -webkit-text-size-adjust:100%; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); height:auto; }
  *, *::before, *::after { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; min-height:100dvh; padding:clamp(14px, 5vw, 36px) clamp(12px, 4vw, 20px);
    background:
      repeating-linear-gradient(90deg, transparent 0 38px, #D4AF6A0D 38px 39px),
      radial-gradient(ellipse at top, #12302A 0%, var(--bg) 70%);
    color:var(--cream); font-family:"Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .card {
    position:relative; width:100%; overflow:hidden; max-width:430px; margin:0 auto; background:var(--panel);
    border:1px solid var(--gold); outline:1px solid var(--gold); outline-offset:-8px;
    padding:clamp(26px, 8vw, 34px) clamp(22px, 7vw, 32px) clamp(28px, 8vw, 36px); text-align:center;
  }
  .corner { position:absolute; width:clamp(30px, 10vw, 44px); height:clamp(30px, 10vw, 44px); pointer-events:none; }
  .corner.tl{top:14px;left:14px} .corner.tr{top:14px;right:14px;transform:scaleX(-1)}
  .corner.bl{bottom:14px;left:14px;transform:scaleY(-1)} .corner.br{bottom:14px;right:14px;transform:scale(-1)}
  .fan { width:min(160px, 46%); height:auto; display:block; margin:4px auto 6px; }
  .en { font-family:"Poiret One", "Didot", serif; color:var(--gold2); letter-spacing:.14em; font-size:clamp(12px, 3.6vw, 15px); }
  h1 {
    font-weight:800; font-size:clamp(26px, 8.4vw, 38px); line-height:1.28; margin:12px 0 6px;
    background:linear-gradient(180deg, var(--gold2), var(--gold) 60%, #9C7A3C);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { font-family:"Poiret One", serif; color:var(--gold); font-size:clamp(14px, 4.4vw, 18px); letter-spacing:.08em; }
  .msg { line-height:1.9; font-size:clamp(14px, 4vw, 15px); margin:20px auto 0; max-width:28em; }
  .rule { display:flex; align-items:center; gap:10px; margin:24px 0 20px; }
  .rule::before, .rule::after { content:""; flex:1; height:1px; background:var(--gold); }
  .rule span { width:9px; height:9px; transform:rotate(45deg); border:1px solid var(--gold); }
  dl { display:grid; gap:18px; }
  dt { font-family:"Poiret One", serif; color:var(--gold); letter-spacing:.18em; font-size:13px; }
  dd { margin-top:5px; font-size:clamp(15px, 4.4vw, 17px); line-height:1.6; }
  dd small { display:block; color:var(--mute); font-size:13px; margin-top:3px; line-height:1.55; }
  a.map {
    display:inline-block; margin-top:12px; padding:11px 20px; min-height:44px; border:1px solid var(--gold);
    color:var(--gold2); text-decoration:none; font-size:14px; letter-spacing:.06em;
  }
  a.map:hover { background:var(--gold); color:var(--bg); }
  a.map:focus-visible { outline:2px solid var(--gold2); outline-offset:3px; }
  .sign { margin-top:26px; font-family:"Poiret One", serif; color:var(--gold2); font-size:15px; letter-spacing:.08em; }
  @media (prefers-reduced-motion:no-preference){
    .card{animation:fade .8s ease-out both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<main class="card">
  <svg class="corner tl" viewBox="0 0 46 46" fill="none" stroke="#D4AF6A" stroke-width="1">
    <path d="M2 44V2h42M8 44V8h36M14 44V14h30"/><path d="M14 14l-12-12"/>
  </svg>
  <svg class="corner tr" viewBox="0 0 46 46" fill="none" stroke="#D4AF6A" stroke-width="1">
    <path d="M2 44V2h42M8 44V8h36M14 44V14h30"/><path d="M14 14l-12-12"/>
  </svg>
  <svg class="corner bl" viewBox="0 0 46 46" fill="none" stroke="#D4AF6A" stroke-width="1">
    <path d="M2 44V2h42M8 44V8h36M14 44V14h30"/><path d="M14 14l-12-12"/>
  </svg>
  <svg class="corner br" viewBox="0 0 46 46" fill="none" stroke="#D4AF6A" stroke-width="1">
    <path d="M2 44V2h42M8 44V8h36M14 44V14h30"/><path d="M14 14l-12-12"/>
  </svg>

  <svg class="fan" viewBox="0 0 170 70" fill="none" stroke="#D4AF6A" stroke-width="1" aria-hidden="true">
    <g id="rays"></g>
    <path d="M45 68a40 40 0 0 1 80 0" />
    <path d="M60 68a25 25 0 0 1 50 0" />
    <circle cx="85" cy="68" r="4" fill="#D4AF6A"/>
  </svg>

  <p class="en" id="greeting"></p>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <p class="msg" id="message"></p>

  <div class="rule"><span></span></div>

  <dl>
    <div><dt>WHEN</dt><dd id="when"></dd></div>
    <div><dt>WHERE</dt><dd><span id="place"></span><small id="address"></small><small id="direction"></small></dd>
      <a class="map" id="map" target="_blank" rel="noopener">네이버 지도에서 보기</a></div>
  </dl>

  <p class="sign" id="sign"></p>
</main>

<script>
  /* ===== 여기만 수정하세요 ===== */
  const INVITE = {
    greeting:  "DEAR OLD SPORT",
    title:     "박대원의\n청첩장 모임",
    subtitle:  "An Evening of Celebration",
    message:   "제 결혼 소식을 직접 전하고 싶어 작은 파티를 엽니다. 술 한잔 기울이며 청첩장을 손에 쥐여 드릴게요.",
    when:      "10월 16일 (금) 오후 7시",
    place:     "공간나인 파티룸 왕십리점",
    address:   "서울 성동구 마조로 15-11, B1층",
    direction: "왕십리역 6번 출구에서 도보 약 5분, 카페 건물 지하 1층",
    mapUrl:    "https://map.naver.com/p/search/공간나인 파티룸 강의실 왕십리점",
    sign:      "— With gratitude, Daewon"
  };
  /* ============================ */

  for (const k of ["greeting","subtitle","message","when","place","address","direction","sign"]) {
    document.getElementById(k).textContent = INVITE[k];
  }
  const t = document.getElementById("title");
  INVITE.title.split("\n").forEach((line, i) => { if (i) t.append(document.createElement("br")); t.append(line); });
  const map = document.getElementById("map");
  INVITE.mapUrl ? map.href = encodeURI(INVITE.mapUrl) : map.remove();
  document.title = INVITE.title.replace("\n", " ");

  // 카카오톡 인앱 브라우저로 열면 기본 브라우저(사파리/크롬)로 다시 열기
  try {
    if (/KAKAOTALK/i.test(navigator.userAgent) && window.top === window && /^https?:/.test(location.href)) {
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    }
  } catch (e) {}

  // 아르데코 부채꼴 빛살
  const g = document.getElementById("rays"), NS = "http://www.w3.org/2000/svg";
  for (let i = 0; i <= 12; i++) {
    const a = Math.PI * i / 12, l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 85 - 44 * Math.cos(a)); l.setAttribute("y1", 68 - 44 * Math.sin(a));
    l.setAttribute("x2", 85 - 82 * Math.cos(a)); l.setAttribute("y2", 68 - 64 * Math.sin(a));
    g.appendChild(l);
  }
</script>
</body>
</html>
